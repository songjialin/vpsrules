name: Update ACL4SSR Custom Rules

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Build merged ACL4SSR configuration
        run: |
          python scripts/merge.py

      - name: Commit changes
        run: |
          if git diff --quiet -- dist/ACL4SSR_Online_Full_WithIcon_Custom.yaml; then
            echo "No changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/ACL4SSR_Online_Full_WithIcon_Custom.yaml
          git commit -m "Update merged ACL4SSR rules"
          git push
