# ============================================================
# Custom patch for ACL4SSR_Online_Full_WithIcon.yaml
#
# Custom additions:
#   1. Claude dedicated proxy group
#   2. ClaudeCore rule provider
#   3. ClaudeCore rule inserted before upstream ACL4SSR rules
#
# Do NOT edit the generated file under dist/ directly.
# ============================================================

# ------------------------------------------------------------
# Claude dedicated proxy group
# ------------------------------------------------------------
proxy-groups:
  - name: Claude
    icon: https://raw.githubusercontent.com/songjialin/vpsrules/main/assets/claude.png
    type: select
    proxies:
      - AI-UNHK
      - 节点选择
      - 自动选择
      - 手动切换
      - DIRECT
      - 台湾节点
      - 日本节点

# ------------------------------------------------------------
# Claude rule provider
# ------------------------------------------------------------
rule-providers:
  ClaudeCore:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/songjialin/vpsrules/main/rules/claude-core-classical.yaml
    path: ./ruleset/ClaudeCore.yaml
    interval: 86400

# ------------------------------------------------------------
# High-priority rules
# ------------------------------------------------------------
prepend-rules:
  - RULE-SET,ClaudeCore,Claude

# ------------------------------------------------------------
# Rules appended after upstream ACL4SSR rules
# ------------------------------------------------------------
append-rules: []
